# llm_chat_app/config.yaml
#
# Single declarative config for this example: connection settings, databases,
# and the roles + their grants. Loaded by main.tf via yamldecode() and consumed
# by providers.tf (connection) and the module (databases, roles).

# ========================================
# PostgreSQL connection settings
# ========================================
# postgres shell commands to create this user:
#   CREATE ROLE admin_user LOGIN CREATEROLE PASSWORD 'insecure-pass-for-demo-admin-user';
#   GRANT pg_monitor TO admin_user WITH ADMIN OPTION;
connection:
  scheme: postgres
  hostname: localhost
  port: 5432
  username: admin_user
  # trunk-ignore(checkov/CKV_SECRET_6): local demo password
  password: insecure-pass-for-demo-admin-user
  superuser: false
  sslmode: disable

# ========================================
# Databases
# ========================================
databases:
  - name: llm_chat_app
    connection_limit: 100

# ========================================
# Roles and grants
# ========================================
roles:
  # Cluster-wide roles
  # Note: admin_user (the RDS master user stored in SSM) serves as the cluster
  # admin and is used by Terraform to connect. It does not need to be created here.
  - name: role_pg_monitoring
    login: false
    inherit: true
    roles:
      - pg_monitor

  - name: custom_pg_monitoring
    login: true
    inherit: true
    roles:
      - role_pg_monitoring
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-monitoring

  # Migration group role - owns all schemas and DDL
  - name: role_service_migration
    login: false
    database_grants:
      database: llm_chat_app
      object_type: database
      privileges:
        - CREATE
        - CONNECT
        - TEMPORARY
    schema_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE, CREATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE, CREATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE, CREATE]
    table_grants:
      - database: llm_chat_app
        schema: app
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES]
    sequence_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE, SELECT, UPDATE]

  # Migration login role - inherits from migration group
  - name: service_migrator
    login: true
    inherit: true
    roles: [role_service_migration]
    connection_limit: 5
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-migrator

  # RW group role - read/write on app schema
  - name: role_service_rw
    login: false
    database_grants:
      database: llm_chat_app
      object_type: database
      privileges: [CONNECT]
    schema_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE]
    table_grants:
      - database: llm_chat_app
        schema: app
        privileges: [SELECT, INSERT, UPDATE, DELETE]
    sequence_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE, SELECT, UPDATE]
    default_privileges:
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: table
        privileges: [SELECT, INSERT, UPDATE, DELETE]
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]

  # RO group role - read-only on app schema
  - name: role_service_ro
    login: false
    database_grants:
      database: llm_chat_app
      object_type: database
      privileges:
        - CONNECT
    schema_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE]
    table_grants:
      - database: llm_chat_app
        schema: app
        privileges: [SELECT]
    sequence_grants:
      - database: llm_chat_app
        schema: app
        privileges: [USAGE, SELECT]
    default_privileges:
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: table
        privileges: [SELECT]
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT]
      - database: llm_chat_app
        schema: app
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]

  # Login roles - app schema (inherit from rw/ro)
  - name: service_fastapi_rw
    login: true
    inherit: true
    roles:
      - role_service_rw
    connection_limit: 30
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-fastapi-rw

  - name: service_fastapi_ro
    login: true
    inherit: true
    roles:
      - role_service_ro
    connection_limit: 30
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-fastapi-ro

  # Pipeline login roles - ref_data schemas + inherited app access
  - name: service_pipeline_rw
    login: true
    inherit: true
    roles: [role_service_rw]
    connection_limit: 10
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-pipeline-rw
    schema_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE]
    table_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE]
    sequence_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE, SELECT, UPDATE]
    default_privileges:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: table
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: table
        privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT, UPDATE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]

  - name: service_pipeline_ro
    login: true
    inherit: true
    roles: [role_service_ro]
    connection_limit: 10
    # trunk-ignore(checkov/CKV_SECRET_6): local demo password
    password: demo-password-pipeline-ro
    schema_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE]
    table_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [SELECT]
    sequence_grants:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        privileges: [USAGE, SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        privileges: [USAGE, SELECT]
    default_privileges:
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: table
        privileges: [SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_abc
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: table
        privileges: [SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: sequence
        privileges: [USAGE, SELECT]
      - database: llm_chat_app
        schema: ref_data_pipeline_xyz
        owner: role_service_migration
        object_type: function
        privileges: [EXECUTE]
